name: CI

on:
  push:
  pull_request:

jobs:

  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and contract tests
        run: pytest -v

  build:
    name: Build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Todo Service
        run: |
          docker build \
            -f todo_service/Dockerfile \
            -t todo-service:latest \
            .

      - name: Build Gateway Service
        run: |
          docker build \
            -f gateway_service/Dockerfile \
            -t gateway-service:latest \
            .
